name: 🌐 GitHub Pages Yayını

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Repoyu Klonla
        uses: actions/checkout@v4

      - name: 🐍 Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📊 JSON Verisini Güncelle ve Hazırla
        run: |
          python scripts/export_json.py
          mkdir -p web/data
          cp data/kampusler.json web/data/kampusler.json
          cp data/istatistikler.json web/data/istatistikler.json

      - name: 🔧 Pages Ayarla
        uses: actions/configure-pages@v5

      - name: 📦 Web Dizinini Arşivle
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web'

      - name: 🚀 GitHub Pages'e Dağıt
        id: deployment
        uses: actions/deploy-pages@v4
