name: 🚀 CI - Doğrulama, Kalite Denetimi ve JSON API Üretimi

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Repoyu Klonla
      uses: actions/checkout@v4

    - name: 🐍 Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 🔍 Bağlantı ve Bütünlük Doğrulaması
      run: |
        python scripts/cli.py validate

    - name: 📐 Şablon ve Format Uyumluluk Denetimi (Linter)
      run: |
        python scripts/validate_campuses.py

    - name: 📊 JSON Veritabanı Üretimi ve Testi
      run: |
        python scripts/export_json.py
        python scripts/cli.py stats

    - name: 🧪 Birim ve Entegrasyon Testleri (Unit & API Tests)
      run: |
        python -m unittest discover tests
