<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>

  <!-- Decorative Glowing Orbs -->
  <circle cx="200" cy="100" r="180" fill="url(#glowGrad)" filter="url(#glow)"/>
  <circle cx="1050" cy="300" r="220" fill="#38bdf8" fill-opacity="0.15" filter="url(#glow)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(100, 60)">
    <rect width="280" height="34" rx="17" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="20" cy="17" r="5" fill="#38bdf8"/>
    <text x="35" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" letter-spacing="1.5">TÜRKİYE'NİN İLK VE EN BÜYÜK</text>
  </g>

  <!-- Main Title -->
  <text x="100" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">
    Türkiye Kampüs Rehberi
  </text>

  <!-- Subtitle with Gradient -->
  <text x="100" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="url(#accentGrad)">
    Öğrenciden Öğrenciye • Filtresiz • 81 İl &amp; 250+ Kampüs Veritabanı
  </text>

  <!-- Description paragraph -->
  <text x="100" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94a3b8">
    Resmi kataloglar binaları gösterir; açık kaynak kültürü o binaların içindeki gerçek yaşamı anlatır.
  </text>
  <text x="100" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94a3b8">
    Ulaşım, KYK yurtları, güncel kiralar, yemekhane ücretleri, artılar/eksiler ve samimi öğrenci tavsiyeleri.
  </text>

  <!-- Feature Cards / Badges on right side -->
  <g transform="translate(100, 320)">
    <!-- Pill 1 -->
    <rect width="180" height="50" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="20" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#38bdf8">81 İL / 100%</text>
    <text x="20" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#64748b">TÜM TÜRKİYE KAPSAMI</text>

    <!-- Pill 2 -->
    <rect x="200" width="180" height="50" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="220" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#818cf8">250+ YERLEŞKE</text>
    <text x="220" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#64748b">DETAYLI ANALİZ</text>

    <!-- Pill 3 -->
    <rect x="400" width="180" height="50" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="420" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#c084fc">PYTHON SDK &amp; CLI</text>
    <text x="420" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#64748b">AI DANIŞMAN ENTEGRELİ</text>

    <!-- Pill 4 -->
    <rect x="600" width="180" height="50" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="620" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#34d399">JSON API &amp; WEB</text>
    <text x="620" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#64748b">GİTHUB PAGES UYUMLU</text>
  </g>

  <!-- Big Decorative Cap Icon -->
  <g transform="translate(980, 80) scale(1.6)" opacity="0.85">
    <path d="M50 10 L5 30 L50 50 L95 30 Z" fill="url(#accentGrad)"/>
    <path d="M20 40 L20 65 Q50 85 80 65 L80 40 Q50 60 20 40 Z" fill="#4338ca"/>
    <line x1="85" y1="35" x2="85" y2="75" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="85" cy="78" r="4" fill="#fbbf24"/>
  </g>
</svg>
